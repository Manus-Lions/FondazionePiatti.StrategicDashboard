name: Pubblica dashboard su GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito statico
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/FondazionePiatti.StrategicDashboard/wwwroot

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
